<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sulzbot Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: monospace; color: #fff; overflow: hidden; touch-action: none; }
    #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { border: 2px solid #444; background: #111; display: block; }
    #hud { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); font-size: clamp(12px, 2.5vw, 18px); z-index: 10; display: flex; gap: clamp(8px, 3vw, 20px); }
    #hud span { background: rgba(0,0,0,0.75); padding: 4px 10px; border-radius: 4px; }
    #startScreen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 40; background: rgba(0,0,0,0.95); padding: clamp(20px, 4vw, 40px); border-radius: 16px; border: 2px solid #0095DD; min-width: 300px; }
    #startScreen h2 { color: #0095DD; margin-bottom: 16px; font-size: clamp(22px, 6vw, 32px); }
    #startScreen .option-row { margin: 8px 0; }
    #startScreen select { font-size: clamp(14px, 3vw, 20px); padding: 6px 14px; background: #222; color: #fff; border: 1px solid #0095DD; border-radius: 6px; font-family: monospace; }
    #startScreen button { padding: 12px 28px; font-size: clamp(16px, 4vw, 20px); background: #0095DD; border: none; border-radius: 8px; color: #fff; font-family: monospace; cursor: pointer; margin-top: 10px; }
    #startScreen button:hover { background: #0077BB; }
    #gameOver { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; z-index: 30; background: rgba(0,0,0,0.95); padding: clamp(20px, 5vw, 40px); border-radius: 16px; border: 2px solid #0095DD; min-width: 280px; }
    #gameOver h2 { margin-bottom: 8px; color: #0095DD; font-size: clamp(20px, 6vw, 32px); }
    #gameOver p { margin: 4px 0; font-size: clamp(14px, 4vw, 20px); }
    #gameOver button { padding: 12px 28px; font-size: clamp(16px, 4vw, 20px); background: #0095DD; border: none; border-radius: 8px; color: #fff; font-family: monospace; cursor: pointer; margin-top: 14px; }
    #winMessage { color: #0F0; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <span>Lives: <span id="lives">3</span></span>
    <span>Score: <span id="score">0</span></span>
    <span>Level: <span id="level">1</span></span>
  </div>

  <div id="gameContainer">
    <canvas id="game"></canvas>
  </div>

  <div id="startScreen">
    <h2>Sulzbot Breakout</h2>
    <div class="option-row">
      <label>Difficulty:</label>
      <select id="difficultySelect" onchange="setDifficulty(this.value)">
        <option value="1">1 - Easy</option>
        <option value="2">2 - Normal</option>
        <option value="3" selected>3 - Hard</option>
        <option value="4">4 - Very Hard</option>
        <option value="5">5 - Extreme</option>
      </select>
    </div>
    <p style="font-size: clamp(12px, 3vw, 16px); margin-top: 8px; color: #aaa;">Swipe anywhere (or arrow/mouse on desktop)</p>
    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="gameOver">
    <h2 id="gameOverTitle">Game Over</h2>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p>Level Reached: <span id="finalLevel">1</span></p>
    <p id="winMessage">You Win! 🎉</p>
    <button onclick="backToStart()">Play Again</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const livesEl = document.getElementById('lives');
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const gameOverDiv = document.getElementById('gameOver');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const finalScoreEl = document.getElementById('finalScore');
    const finalLevelEl = document.getElementById('finalLevel');
    const winMessage = document.getElementById('winMessage');
    const startScreen = document.getElementById('startScreen');

    const brickRowCount = 6;
    const brickHeight = 20;
    const brickPadding = 10, brickOffsetTop = 50, brickOffsetLeft = 40;
    const ballSize = 12;
    const paddleHeight = 20;

    let canvasWidth, canvasHeight, paddleWidth, brickWidth;
    let isMobile = false;

    let difficulty = 3;
    let level = 1;
    let paddleX, ballX, ballY, ballDX, ballDY;
    let lives, score;
    let rightPressed = false, leftPressed = false;
    let bricks = [];
    let animationId = null;

    const speeds = [3, 4.5, 6, 7.5, 9]; // difficulty 1-5

    function computeSizes() {
      const maxWidth = Math.min(window.innerWidth * 0.95, 800);
      const maxHeight = window.innerHeight * 0.85;
      canvasWidth = maxWidth;
      canvasHeight = maxHeight;
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      paddleWidth = Math.max(80, canvasWidth * 0.15);
      brickWidth = (canvasWidth - brickOffsetLeft * 2 - brickPadding * 11) / 12;
      isMobile = window.innerWidth <= 768 || window.innerHeight <= 768;
    }

    function randomBrickLayout() {
      const rows = Math.floor(4 + Math.random() * 4); // 4-7 rows
      const cols = 8 + Math.floor(Math.random() * 5); // 8-12 columns
      const layout = [];
      for (let r = 0; r < rows; r++) {
        layout.push([]);
        for (let c = 0; c < cols; c++) {
          // Random brick presence for varied layouts
          layout[r][c] = Math.random() > 0.2 ? 1 : 0;
        }
      }
      return layout;
    }

    function initBricks() {
      const layout = randomBrickLayout();
      const brickRowCountActual = layout.length;
      const brickColumnCountActual = layout[0] ? layout[0].length : 12;
      bricks = [];
      for (let c = 0; c < brickColumnCountActual; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCountActual; r++) {
          bricks[c][r] = { x: 0, y: 0, status: layout[r][c] || 0 };
        }
      }
      // Recompute brick width for this level
      const actualCols = brickColumnCountActual || 12;
      brickWidth = (canvasWidth - brickOffsetLeft * 2 - brickPadding * (actualCols - 1)) / actualCols;
    }

    function setDifficulty(d) {
      difficulty = parseInt(d);
    }

    function resetBall() {
      ballX = canvasWidth / 2;
      ballY = canvasHeight - paddleHeight - 30;
      const baseSpeed = speeds[difficulty - 1] || 5;
      ballDX = baseSpeed * (Math.random() > 0.5 ? 1 : -1);
      ballDY = -baseSpeed;
      paddleX = (canvasWidth - paddleWidth) / 2;
    }

    function startGame() {
      startScreen.style.display = 'none';
      lives = 3;
      score = 0;
      level = 1;
      livesEl.innerText = lives;
      scoreEl.innerText = score;
      levelEl.innerText = level;
      initBricks();
      resetBall();
      if (animationId) cancelAnimationFrame(animationId);
      draw();
    }

    function backToStart() {
      gameOverDiv.style.display = 'none';
      startScreen.style.display = 'block';
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballSize/2, 0, Math.PI*2);
      const gradient = ctx.createRadialGradient(ballX - 2, ballY - 2, 0, ballX, ballY, ballSize/2);
      gradient.addColorStop(0, '#00AAFF');
      gradient.addColorStop(1, '#005588');
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.closePath();
    }

    function drawPaddle() {
      ctx.beginPath();
      ctx.roundRect(paddleX, canvasHeight - paddleHeight, paddleWidth, paddleHeight, 8);
      const gradient = ctx.createLinearGradient(0, canvasHeight - paddleHeight, 0, canvasHeight);
      gradient.addColorStop(0, '#0095DD');
      gradient.addColorStop(1, '#005588');
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.closePath();
    }

    function drawBricks() {
      const rows = bricks[0] ? bricks[0].length : 0;
      const cols = bricks.length || 12;
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          const b = bricks[c][r];
          if (b && b.status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            b.x = brickX;
            b.y = brickY;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 4);
            const hue = 200 + (r * 15) + (level * 5);
            const gradient = ctx.createLinearGradient(0, brickY, 0, brickY + brickHeight);
            gradient.addColorStop(0, `hsl(${hue}, 80%, 55%)`);
            gradient.addColorStop(1, `hsl(${hue}, 80%, 35%)`);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function checkWin() {
      let broken = true;
      for (let c = 0; c < bricks.length; c++) {
        for (let r = 0; r < bricks[c].length; r++) {
          if (bricks[c][r] && bricks[c][r].status === 1) {
            broken = false;
            break;
          }
        }
        if (!broken) break;
      }
      return broken;
    }

    function nextLevel() {
      level++;
      levelEl.innerText = level;
      initBricks();
      resetBall();
      // Slight speed increase per level
      ballDX *= 1.1;
      ballDY *= 1.1;
    }

    function collisionDetection() {
      const rows = bricks[0] ? bricks[0].length : 0;
      const cols = bricks.length || 12;
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          const b = bricks[c][r];
          if (b && b.status === 1 &&
              ballX > b.x && ballX < b.x + brickWidth &&
              ballY > b.y && ballY < b.y + brickHeight) {
            ballDY = -ballDY;
            b.status = 0;
            score += 10 * level;
            scoreEl.innerText = score;
          }
        }
      }
    }

    function gameOver(won = false) {
      gameOverDiv.style.display = 'block';
      finalScoreEl.innerText = score;
      finalLevelEl.innerText = level;
      gameOverTitle.innerText = won ? 'Level Complete!' : 'Game Over';
      winMessage.style.display = won ? 'block' : 'none';
      cancelAnimationFrame(animationId);
    }

    function draw() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      drawBricks();
      drawBall();
      drawPaddle();
      collisionDetection();

      ballX += ballDX;
      ballY += ballDY;

      if (ballX + ballSize/2 > canvasWidth || ballX - ballSize/2 < 0) ballDX = -ballDX;
      if (ballY - ballSize/2 < 0) ballDY = -ballDY;

      if (ballY + ballSize/2 > canvasHeight) {
        lives--;
        livesEl.innerText = lives;
        if (!lives) {
          gameOver(false);
        } else {
          resetBall();
        }
      }

      if (ballY + ballSize/2 > canvasHeight - paddleHeight && ballX > paddleX && ballX < paddleX + paddleWidth) {
        ballDY = -Math.abs(ballDY);
        const hitPos = (ballX - paddleX) / paddleWidth;
        ballDX = (speeds[difficulty - 1] || 5) * (hitPos - 0.5) * 3;
      }

      if (!isMobile) {
        if (rightPressed && paddleX < canvasWidth - paddleWidth) paddleX += 7 * (difficulty);
        else if (leftPressed && paddleX > 0) paddleX -= 7 * (difficulty);
      }

      // Check level progression
      if (checkWin()) {
        nextLevel();
      }

      requestAnimationFrame(draw);
    }

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Right') rightPressed = true;
      else if (e.key === 'ArrowLeft' || e.key === 'Left') leftPressed = true;
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Right') rightPressed = false;
      else if (e.key === 'ArrowLeft' || e.key === 'Left') leftPressed = false;
    });

    // Mouse (desktop)
    canvas.addEventListener('mousemove', (e) => {
      if (isMobile) return;
      const rect = canvas.getBoundingClientRect();
      paddleX = e.clientX - rect.left - paddleWidth / 2;
      paddleX = Math.max(0, Math.min(canvasWidth - paddleWidth, paddleX));
    });

    // Mobile swipe anywhere
    let touchStartX = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      e.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      const touchX = e.touches[0].clientX;
      const delta = touchX - touchStartX;
      if (delta > 20) { paddleX += 15; touchStartX = touchX; }
      else if (delta < -20) { paddleX -= 15; touchStartX = touchX; }
      paddleX = Math.max(0, Math.min(canvasWidth - paddleWidth, paddleX));
      e.preventDefault();
    }, { passive: false });

    function handleResize() {
      computeSizes();
      if (paddleX !== undefined) paddleX = Math.max(0, Math.min(canvasWidth - paddleWidth, paddleX));
      if (animationId) cancelAnimationFrame(animationId);
      draw();
    }

    window.addEventListener('resize', handleResize);
    computeSizes();
  </script>
</body>
</html>
